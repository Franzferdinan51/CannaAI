# Netlify hosts the static Vite UI only. The root Next.js custom server and
# Socket.IO/API endpoints must be deployed with Docker or Kubernetes.
[build]
  base = "NewUI/cannaai-pro"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
