name: CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  NODE_VERSION: '22.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  checks:
    name: Lint, typecheck, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Install static UI dependencies
        run: npm ci --prefix NewUI/cannaai-pro
      - name: Initialize SQLite test database
        run: DATABASE_URL=file:./test.db npm run db:push
      - name: Run lint
        run: npm run lint
      - name: Run frontend typecheck
        run: npm run typecheck:frontend
      - name: Run unit tests
        run: npm run test:unit -- --ci
      - name: Run integration tests
        run: npm run test:integration -- --ci

  build:
    name: Build applications
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Initialize SQLite build database
        run: DATABASE_URL=file:./build.db npm run db:push
      - name: Install static UI dependencies
        run: npm ci --prefix NewUI/cannaai-pro
      - name: Build static UI
        run: npm run build:frontend
      - name: Build root server
        run: npm run build:backend

  docker:
    name: Build container
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
